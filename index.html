<!DOCTYPE html>
<html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Happy Girlfriend's Day Meri Kuchupuchu ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Cormorant Garamond',serif;background:linear-gradient(#fff5f8,#ffe4ef);overflow-x:hidden;color:#5a2140}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
h1{font-family:"Dancing Script",cursive;font-size:3rem;color:#ff4f87} h2,h3{font-family:"Dancing Script",cursive;color:#ff4f87} p,li,button{font-family:"Cormorant Garamond",serif;font-size:1.2rem}
.card{background:#fff;border-radius:18px;padding:20px;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.1);margin:18px}
button{background:#ff4f87;color:#fff;border:0;padding:14px 24px;border-radius:999px;font-size:1rem}
.heart{position:fixed;bottom:-20px;font-size:20px;animation:up 7s linear forwards}
@keyframes up{to{transform:translateY(-120vh);opacity:0}}
.fade{opacity:0;transform:translateY(20px);transition:1s}.show{opacity:1;transform:none}

.signature{
font-family:"Dancing Script",cursive;
font-size:2rem;
color:#e91e63;
font-weight:bold;
text-align:center;
animation:glow 2s ease-in-out infinite alternate;
}
@keyframes glow{from{text-shadow:0 0 5px #ff9ac7}to{text-shadow:0 0 18px #ff4f87}}

</style></head>
<body>
<audio id='bgMusic' loop><source src='high-on-you.mp3' type='audio/mpeg'></audio>
<section class='hero'>
<h1>❤️🌷Happy Girlfriend's Day Meri Pyari Tanuuu🌷❤️</h1>
 <img
    src="your-image.png"
    alt="Our Love"
    style="
        width:95%;
        max-width:420px;
        display:block;
        margin:20px auto;
        border-radius:20px;
        box-shadow:0 10px 25px rgba(0,0,0,.15);
    ">
<div class='card fade'><p id='type'></p></div>
<div class='card fade'><h3>I Love You So Muchhh😘😘😘</h3><ul id="loveList" style="text-align:left;list-style:none;padding-left:0;line-height:1.8;"></ul><button id="nextBtn">Next 💕</button></div><button id='surprise' style='display:none'>Jaldi se yaha click karoooo 💝</button>
</section>
<script>

const bgMusic=document.getElementById('bgMusic');
let musicStarted=false;
function startMusic(){
 if(!musicStarted){
  bgMusic.play().catch(()=>{});
  musicStarted=true;
 }
}
document.addEventListener('click',startMusic,{once:true});

const msg=`💕💕Meri Pyari Kuchupuchuuu ke liye💕💕,\n\n💕💕 Bhot lucky hu ki tum mujhse pyar karti ho aur hum relation mein hai, hum aage bhi ek dusre se bohot pyar karte rahenge💕💕\n\n❤️❤️Happy Girlfriend's Day to Meri Tanuuu ❤️❤️\n\n💞💞Main tainu bhot pyaar karda haan, kall vi karanga, te hamesha hi bhot sara pyar karda ravanga💞💞\n\n💕💕 I love you so much Meri Pyariii Tanuuu💕💕.`;
let i=0;function t(){if(i<msg.length){type.innerHTML+=msg[i]=="\n"?"<br>":msg[i];i++;setTimeout(t,35)}};t();
const obs=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('show',e.isIntersecting)));document.querySelectorAll('.fade').forEach(x=>obs.observe(x));
function heart(){let h=document.createElement('div');h.className='heart';h.textContent='💖';h.style.left=Math.random()*100+'vw';h.style.fontSize=(16+Math.random()*24)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),7000)}
setInterval(heart,350);

const loveMessages=[
"💕💕 Tumhari pyari si hasi, tumhara pyara sa sasta ASMR, tumhara pyare random voice notes, tumhari pyari aankhein, tumhara sabse khubsurat dil, aur puri ki puri tummm, inn sabse bohot pyar karta huu💕💕",
"💕💕 Mere naye naam rakhna aur naye atrangi gaali dena, inn sabse bohot pyar karta hu meri kuchupuchu💕💕",
"💕💕Tumse hi meri sari khushiya hai, tumhare liye hi mera pura pyar hai, tumhare sath hi abh yeh pura zindagi gujaarna hai💕💕",
"💕💕Meri pyari tanu, mana ke mujhse galtiya hojati hai, par aaj phir se pura dil se promise karta hu ki kudko improve karunga aur tumhe bohot zyada pyar karunga even on the days jab tumhare moods swings ho aur tum man-hater bann jao, main tab bhi tumse bohot pyar karunga meri pyari madam ji💕💕",
"💕💕Gandmare Galeech ke Gungune Gulab Jamun💕💕\nUdta hua parinda, Toshiii Darindaa💕💕 - Yeh bhot miss karta hu meri kuchupuchu",
"💕💕 Tumhara Pyara Gulab Jamun & Darindaa 💕💕"
];
let current=0,typing=false;
function tw(el,t,s,cb){let i=0;function f(){if(i<t.length){el.innerHTML+=t.charAt(i++);setTimeout(f,s)}else{typing=false;cb&&cb();}}f();}
nextBtn.onclick=()=>{if(typing||current>=loveMessages.length)return;typing=true;nextBtn.disabled=true;let li=document.createElement('li');loveList.appendChild(li);tw(li,loveMessages[current],25,()=>{if(current===loveMessages.length-1){li.classList.add('signature');}current++;nextBtn.disabled=false;if(current===loveMessages.length){nextBtn.style.display='none';surprise.style.display='inline-block';}});};

surprise.onclick=()=>{for(let j=0;j<80;j++)setTimeout(heart,j*25);surprise.outerHTML="<div class='card show'><h2>🌷🌷🌷 Ek aurrr baattt sunloooo😘😘😘</h2><p>Chahe hum dono ke life mein kuch bhi hojaye, kitna bhi kalesh karle, main hamesha tumse hi pyar karunga aur tumhari daant bhi sununga, par kabhi bhi tumpe gussa nhi karunga aur tumhe bohot pyar se handle karunga 💕💕</p><h1>I Love You meri pyariii tanuuu💕💕</h1></div>";}
</script>
</body></html>
